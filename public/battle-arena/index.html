<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Showdown battlefield</title>
  <link rel="stylesheet" href="https://play.pokemonshowdown.com/style/battle.css">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&amp;display=swap">
  <link rel="stylesheet" href="/battle-arena/eclipse.css?v=2">
  <link rel="stylesheet" href="/battle-arena/arena.css?v=5">
  <script defer src="https://play.pokemonshowdown.com/config/config.js"></script>
  <script defer src="https://play.pokemonshowdown.com/js/lib/jquery-1.11.0.min.js"></script>
  <script defer src="https://play.pokemonshowdown.com/js/lib/html-sanitizer-minified.js"></script>
  <script defer src="https://play.pokemonshowdown.com/js/battle-sound.js"></script>
  <script defer src="https://play.pokemonshowdown.com/js/battledata.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/pokedex-mini.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/pokedex-mini-bw.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/graphics.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/pokedex.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/moves.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/abilities.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/items.js"></script>
  <script defer src="https://play.pokemonshowdown.com/data/teambuilder-tables.js"></script>
  <script defer src="https://play.pokemonshowdown.com/js/battle-tooltips.js"></script>
  <script defer src="https://play.pokemonshowdown.com/js/battle.js"></script>
  <script defer src="/battle-arena/arena.js?v=5"></script>
</head>
<body>
  <div id="arena" data-theme="arcade" data-bounce="true">
    <div class="battlefield">
      <div class="battle" aria-label="Battlefield"></div>
      <div class="portrait-track" aria-hidden="true">
        <div class="portrait-track__horizontal">
          <div class="portrait-track__badge">
            <img src="/saras-headshot.jpg" alt="" width="24" height="24">
            <span>Saras</span>
          </div>
        </div>
      </div>
      <div class="shuckle-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <section class="battle-feed" aria-labelledby="battle-feed-title" data-feed-view="log">
      <header class="battle-feed__heading">
        <h1 id="battle-feed-title">Battle feed</h1>
        <span>vs. Totally Real Saras</span>
      </header>
      <div class="battle-feed__views" aria-label="Battle feed views" role="group">
        <button type="button" data-feed-view="log" aria-pressed="true" aria-controls="battle-log">Battle log</button>
        <button type="button" data-feed-view="chat" aria-pressed="false" aria-controls="battle-chat">Chat</button>
      </div>
      <div class="battle-feed__callout" aria-live="polite" hidden>
        <img src="/saras-headshot.jpg" alt="" width="27" height="27">
        <div><strong>Totally Real Saras</strong><div data-banter></div></div>
      </div>
      <div id="battle-log" class="battle-log" role="log" aria-label="Battle log" tabindex="0"></div>
      <div id="battle-chat" class="battle-chat" hidden>
        <div class="battle-chat__history" role="log" aria-label="Chat messages" tabindex="0"></div>
        <div class="battle-chat__compose">
          <input type="text" maxlength="140" aria-label="Message Totally Real Saras" placeholder="type a message" autocomplete="off">
          <button type="button">Send</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
